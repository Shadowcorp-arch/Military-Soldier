<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Neon Soldier Run</title><link href="https://googleapis.com" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#08051a;color:#fff;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,#1e0f47 0%,#0a051d 70%,#020107 100%);z-index:-1}#gameContainer{position:relative;background:rgba(20,15,45,0.4);border:2px solid rgba(0,242,254,0.25);border-radius:20px;padding:20px;box-shadow:0 0 40px rgba(0,242,254,0.15),inset 0 0 20px rgba(138,43,226,0.15);backdrop-filter:blur(10px)}canvas{display:block;background:#0d0926;border-radius:12px;box-shadow:inset 0 0 30px rgba(0,0,0,0.8)}#instructions{margin-top:15px;text-align:center;color:#8b83ba;font-family:'JetBrains Mono',monospace;font-size:13px;text-transform:uppercase;letter-spacing:2px}#instructions span{color:#00f2fe;font-weight:bold}#gameOverScreen{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,5,25,0.95);border:3px solid #ff0055;border-radius:16px;padding:40px;text-align:center;box-shadow:0 0 50px rgba(255,0,85,0.4);width:380px;z-index:100}#gameOverScreen h2{font-size:28px;color:#ff0055;letter-spacing:4px;margin-bottom:15px;text-shadow:0 0 10px rgba(255,0,85,0.6)}#gameOverScreen p{color:#b4efff;font-size:16px;margin-bottom:25px}#gameOverScreen span{color:#00f2fe;font-size:22px;font-family:'JetBrains Mono',monospace;display:block;margin-top:5px;text-shadow:0 0 8px rgba(0,242,254,0.5)}button{width:100%;padding:14px;font-size:16px;font-family:'Space Grotesk',sans-serif;font-weight:bold;color:#fff;background:linear-gradient(90deg,#ff0055,#9d00ff);border:none;border-radius:8px;cursor:pointer;letter-spacing:2px;transition:all .3s ease;box-shadow:0 0 15px rgba(255,0,85,0.4)}button:hover{transform:translateY(-2px);box-shadow:0 0 25px rgba(157,0,255,0.7);filter:brightness(1.2)}</style></head><body><div id="gameContainer"><canvas id="gameCanvas" width="850" height="300"></canvas><div id="gameOverScreen"><h2>SISTEMA CAÍDO</h2><p>DATOS RECOLECTADOS:<span id="finalScore">0</span></p><button onclick="resetGame()">REINICIAR OPERACIÓN</button></div><div id="instructions">[<span>↑</span> / <span>ESPACIO</span>] SALTO TÁCTICO &nbsp;&nbsp;&nbsp;&nbsp; [<span>↓</span>] AGACHARSE EN TRINCHERA</div></div><script>const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),gameOverScreen=document.getElementById('gameOverScreen'),finalScoreTxt=document.getElementById('finalScore');let isPlaying=!0,score=0,gameSpeed=7,obstacles=[],particles=[],bgStars=[],frameCount=0,keys={};for(let i=0;i<40;i++)bgStars.push({x:Math.random()*canvas.width,y:Math.random()*180,size:Math.random()*2,speed:.2+Math.random()*.5});const soldier={x:80,y:220,width:34,height:55,originalHeight:55,duckHeight:30,gravity:.65,velocity:0,jumpStrength:-13.5,isGrounded:!0,isDucking:!1,runCycle:0,draw(){ctx.save(),isPlaying&&Math.random()>.4&&(ctx.fillStyle='rgba(0, 242, 254, 0.15)',ctx.fillRect(this.x-8,this.y+2,this.width,this.height)),ctx.fillStyle='#00f2fe',ctx.shadowBlur=15,ctx.shadowColor='#00f2fe',ctx.fillRect(this.x,this.y,this.width,this.height),ctx.fillStyle='#140f2d',ctx.shadowBlur=0,ctx.fillRect(this.x+2,this.y-12,26,12),ctx.fillStyle='#ff0055',ctx.shadowBlur=10,ctx.shadowColor='#ff0055',ctx.fillRect(this.x+16,this.y-8,14,5),ctx.fillStyle='#7928ca',ctx.shadowBlur=0,ctx.fillRect(this.x-5,this.y+6,7,22),ctx.fillStyle='#ffffff',ctx.shadowBlur=12,ctx.shadowColor='#fff',this.isDucking?(ctx.fillRect(this.x+18,this.y+10,32,7),ctx.fillStyle='#00f2fe',ctx.fillRect(this.x+44,this.y+12,8,3)):(ctx.fillRect(this.x+20,this.y+18,34,7),ctx.fillStyle='#00f2fe',ctx.fillRect(this.x+48,this.y+20,8,3)),ctx.shadowBlur=0,ctx.fillStyle='#7928ca';if(! ),this.color=i,this.alpha=1}draw(){ctx.save(),ctx.globalAlpha=this.alpha,ctx.fillStyle=this.color,ctx.shadowBlur=8,ctx.shadowColor=this.color,ctx.fillRect(this.x,this.y,this.size,this.size),ctx.restore()}update(){this.x+=this.speedX,this.y+=this.speedY,this.alpha-=.025}}function createExplosion(e,t,i,s=12){for(let a=0;a<s;a++)particles.push(new Particle(e,t,i))}window.addEventListener('keydown',e=>{keys[e.key]=!0,(' '===e.key||'ArrowUp'===e.key)&&e.preventDefault()}),window.addEventListener('keyup',e=>{keys[e.key]=!1});function checkCollision(e,t){return e.x<t.x+t.width&&e.x+e.width>t.x&&e.y<t.y+t.height&&e.y+e.height>t.y}function drawCyberGround(){ctx.strokeStyle='rgba(138, 43, 226, 0.4)',ctx.lineWidth=3,ctx.shadowBlur=12,ctx.shadowColor='#8a2be2',ctx.beginPath(),ctx.moveTo(0,275),ctx.lineTo(canvas.width,275),ctx.stroke(),ctx.shadowBlur=0,ctx.strokeStyle='rgba(138, 43, 226, 0.15)',ctx.lineWidth=1;let e=frameCount*gameSpeed%40;for(let t=-e;t<canvas.width;t+=40)ctx.beginPath(),ctx.moveTo(t,275),ctx.lineTo(t-20,canvas.height),ctx.stroke()}function gameLoop(){if(!isPlaying)return;ctx.fillStyle='#0d0926',ctx.fillRect(0,0,canvas.width,canvas.height),frameCount++,ctx.fillStyle='rgba(255, 255, 255, 0.4)',bgStars.forEach(e=>{e.x-=e.speed,e.x<0&&(e.x=canvas.width),ctx.fillRect(e.x,e.y,e.size,e.size)}),frameCount%450==0&&(gameSpeed+=.4),drawCyberGround(),soldier.update(),soldier.draw(),Math.random()<.1&&particles.push(new Particle(soldier.x,soldier.y+soldier.height-5,'#8a2be2'));for(let e=particles.length-1;e>=0;e--)particles[e].update(),particles[e].draw(),particles[e].alpha<=0&&particles.splice(e,1);if(frameCount%80==0||Math.random()<.02&&frameCount%40==0)(0===obstacles.length||canvas.width-obstacles[obstacles.length-1].x>280)&&obstacles.push(new Obstacle);for(let e=obstacles.length-1;e>=0;e--)if(obstacles[e].update(),obstacles[e].draw(),checkCollision(soldier,obstacles[e]))createExplosion(soldier.x+15,soldier.y+20,'#ff0055',25),createExplosion(soldier.x+15,soldier.y+20,'#0
